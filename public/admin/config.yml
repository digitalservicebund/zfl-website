local_backend: true # reads/writes the local repo via `npx decap-server`

backend:
  name: github
  repo: digitalservicebund/zfl-website
  branch: main

media_folder: "src/images"
public_folder: "/images"

collections:
  - name: "werkzeuge"
    label: "Werkzeuge"
    label_singular: "Werkzeug"
    folder: "src/werkzeuge" # matches the `werkzeuge` collection in src/content.config.ts
    create: true
    extension: "md"
    format: "frontmatter"
    media_folder: ""
    public_folder: ""
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - label: "Type"
        name: "type"
        widget: "select"
        multiple: true
        options: ["Methode", "Leitfaden", "Tool", "Ressource"]
      - label: "Category"
        name: "category"
        widget: "select"
        multiple: true
        options:
          [
            "Problemanalyse",
            "Praxistauglichkeit",
            "Rechtsförmlichkeit",
            "Folgenabschätzung",
            "Beteiligung",
          ]
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Source", name: "source", widget: "string", required: false }
      - {
          label: "External URL",
          name: "externalUrl",
          widget: "string",
          required: false,
        }
      - { label: "Image", name: "image", widget: "image", required: false }
