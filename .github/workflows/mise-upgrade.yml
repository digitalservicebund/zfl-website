name: Upgrade mise-managed tool versions

# Dependabot does not support the mise ecosystem yet
# (https://github.com/dependabot/dependabot-core/pull/14500), so this workflow
# keeps the versions pinned in mise.toml from going stale silently.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # Runs every day at 6am

permissions:
  contents: write
  pull-requests: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upgrade pinned tool versions
        # node is excluded: its version bumps have a bigger blast radius and
        # deserve deliberate review rather than an automated PR.
        # minimum-release-age holds back versions released in the last 3 days,
        # giving newly-published releases time to surface problems before we
        # pick them up automatically.
        run: mise upgrade --bump --exclude node --minimum-release-age 3d
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore(mise): bump pinned tool versions"
          title: "chore(mise): bump pinned tool versions"
          body: >
            Automated upgrade of the tool versions pinned in `mise.toml`
            (all except node). Dependabot does not currently support the
            mise ecosystem, so this workflow keeps these pins from going
            stale. Versions released in the last 3 days are held back; see
            the draft "bump tool versions still in cooldown" PR for those.
          branch: chore/mise-upgrade
          labels: dependencies

      - name: Detect updates still held back by the cooldown
        id: cooldown-pending
        run: |
          mise outdated --bump --json | jq 'del(.node)' > outdated.json

          # Reset to main's actual mise.toml/mise.lock: the previous step may have
          # left the checkout on the chore/mise-upgrade branch, and this PR must be
          # an independent, minimal diff from main, not stacked on that branch.
          git fetch origin main
          git checkout origin/main -- mise.toml mise.lock

          # Explicit tool@version pins bypass minimum-release-age entirely (mise
          # only filters fuzzy/latest lookups), so this applies just the still-
          # cooling-down versions without waiting out the cooldown.
          args=$(jq -r 'to_entries | map("\(.key)@\(.value.latest)") | join(" ")' outdated.json)
          if [ -n "$args" ]; then
            mise upgrade --bump $args
          fi

          body=$(jq -r '
            if length == 0 then
              "Nothing is currently being held back by the cooldown."
            else
              "The following updates are still inside the 3-day upgrade cooldown. Check the release notes before merging this early — only do so if one is a security fix:\n\n" +
              (to_entries | map("- **\(.key)** \(.value.current // "?") → \(.value.latest)" + (if .value.release_url then " — [release notes](\(.value.release_url))" else "" end)) | join("\n"))
            end
          ' outdated.json)

          delimiter="$(openssl rand -hex 8)"
          echo "body<<$delimiter" >> "$GITHUB_OUTPUT"
          echo "$body" >> "$GITHUB_OUTPUT"
          echo "$delimiter" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create draft pull request for cooldown-pending updates
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          base: main
          commit-message: "chore(mise): bump tool versions still in cooldown"
          title: "chore(mise): bump tool versions still in cooldown"
          body: ${{ steps.cooldown-pending.outputs.body }}
          branch: chore/mise-upgrade-cooldown-pending
          draft: true
          labels: dependencies
