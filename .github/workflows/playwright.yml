name: Playwright Tests

on:
  workflow_call:
    secrets:
      SLACK_BOT_TOKEN:
        required: true
      SLACK_CHANNEL_ID:
        required: true

env:
  PACKAGE_NAME: zfl-website
  ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      - name: Cache pnpm dependencies
        id: cache-pnpm-deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            **/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        if: steps.cache-pnpm-deps.outputs.cache-hit != 'true'
        run: pnpm install --ignore-scripts

      - name: Get installed Playwright version
        id: playwright-version
        run: |
          echo "PLAYWRIGHT_VERSION=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> $GITHUB_ENV

      - name: Cache Playwright browsers
        id: playwright-cache-deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache-deps.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps

      - name: Install Playwright Browsers - Cached
        if: steps.playwright-cache-deps.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Build app Docker container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: zfl-website:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Both stages are tested on every run. The stage this run is for (PR:
      # staging, main: production) runs in all browsers, the other in Chromium only.
      - name: Run Playwright tests (staging)
        id: e2e-staging
        env:
          PUBLIC_STAGE: staging
          PROJECT_ARGS: ${{ github.ref == 'refs/heads/main' && '--project=chromium' || '' }}
        run: PLAYWRIGHT_USE_DOCKER=true pnpm exec playwright test $PROJECT_ARGS

      - name: Run Playwright tests (production)
        if: ${{ !cancelled() && steps.e2e-staging.outcome != 'skipped' }}
        env:
          PUBLIC_STAGE: production
          PROJECT_ARGS: ${{ github.ref != 'refs/heads/main' && '--project=chromium' || '' }}
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-production
        run: |
          docker rm -f zfl-website || true
          PLAYWRIGHT_USE_DOCKER=true pnpm exec playwright test $PROJECT_ARGS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            playwright-report-production/
          retention-days: 1

      - name: Send failure to Slack
        uses: digitalservicebund/notify-on-failure-gha@b8fdda76a38fa8e94cf623ebdd03e4570bc4ceb0 # v1.9.0
        if: ${{ failure() }}
        with:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
